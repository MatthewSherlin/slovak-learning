[project]
name = "slovak-learning"
version = "0.1.0"
description = "AI-powered Slovak language learning app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    # 1.x is untested here and no longer brings httpx with it
    "anthropic>=0.42.0,<1.0",
    # imported directly by app/llm.py for the OpenRouter client
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
